<!DOCTYPE html>
<html>
<head>
    <title>Student List</title>
</head>
<body>

    <h1>Student List</h1>

    <p>Welcome, {{ request.user.username }}</p>

<form method="POST" action="{% url 'logout' %}">
    {% csrf_token %}
    <button type="submit">Logout</button>
</form>

    <a href="/create/">Add Student</a>

    <hr>

    {% for student in students %}
    <p>
        {{ student.name }} |
        {{ student.email }} |
        {{ student.age }} |
        <a href="{% url 'student_update' student.id %}">Edit</a> |
        <a href="{% url 'student_delete' student.id %}" onclick="return confirm('Are you sure you want to delete this student?');">Delete</a>
    </p>
    {% empty %}
        <p>No students found.</p>
    {% endfor %}

</body>
</html>
